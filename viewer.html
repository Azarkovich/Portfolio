<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write-Up Viewer | Xavier TOKO-PROUST</title>

    <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' https://gc.zgo.at https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
             font-src https://fonts.gstatic.com;
             img-src 'self' data:;
             connect-src 'self' https://azarkovich.goatcounter.com;
             frame-ancestors 'none';
             base-uri 'self';
             form-action 'self';">
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        #markdown-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--text-color);
            border-radius: 8px;
            text-align: left;
        }

        #markdown-content img {
            max-width: 100%;
            height: auto;
            display: block;
            box-sizing: border-box;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            margin: 20px auto;
        }

        #markdown-content h1, #markdown-content h2, #markdown-content h3 {
            color: var(--accent-color);
            margin-top: 1.5em;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 0.5em;
        }

        #markdown-content p, #markdown-content li {
            line-height: 1.6;
            color: #ccc;
        }

        #markdown-content pre {
            border-radius: 6px;
            border: 1px solid #333;
            margin: 15px 0;
        }

        #markdown-content code {
            font-family: 'Fira Code', monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 5px;
            border-radius: 3px;
        }

        #markdown-content pre code {
            background: none;
            padding: 0;
        }

        #markdown-content blockquote {
            border-left: 4px solid var(--accent-color);
            margin: 15px 0;
            padding-left: 20px;
            background: rgba(0, 255, 0, 0.05);
            font-style: italic;
        }

        /* ── Language toggle bar ── */
        #lang-bar {
            max-width: 800px;
            margin: 0 auto 14px auto;
            display: none;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .lang-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .lang-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(46, 164, 79, 0.08);
        }

        .lang-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* "FR coming soon" notice */
        #fr-pending {
            max-width: 800px;
            margin: 0 auto 16px auto;
            padding: 8px 16px;
            border-left: 3px solid #ffb86c;
            background: rgba(255, 184, 108, 0.07);
            color: #ffb86c;
            font-size: 0.82rem;
            border-radius: 0 4px 4px 0;
            display: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo-container">
            <div class="logo-text">
                <span class="prompt">></span> Xavier TOKO-PROUST<span class="cursor">_</span>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"    data-i18n="nav.home">[ ./Home ]</a></li>
            <li><a href="writeups.html" data-i18n="nav.writeups">[ ./Writeups ]</a></li>
        </ul>
    </nav>

    <section class="container" style="margin-top: 100px; margin-bottom: 50px;">

        <div id="loading" style="text-align: center;" data-i18n="viewer.loading">[ Fetching data stream... ]</div>

        <!-- Language toggle — revealed after content loads -->
        <div id="lang-bar">
            <button id="btn-en" class="lang-btn active" onclick="switchLang('en')">🇬🇧 EN</button>
            <button id="btn-fr" class="lang-btn"        onclick="switchLang('fr')">🇫🇷 FR</button>
        </div>

        <!-- Shown when no .fr.md exists yet -->
        <div id="fr-pending">
            ⚠ Version française non disponible pour ce writeup — affichage en anglais.
        </div>

        <div id="markdown-content"></div>

        <div style="text-align: center; margin-top: 40px;">
            <a href="writeups.html" class="btn-link" data-i18n="btn.return">← Return to Archive</a>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="i18n.js"></script>

    <script>
        const urlParams  = new URLSearchParams(window.location.search);
        const fileName   = urlParams.get('file');               // e.g. "xss-dvwa.md"
        const fileNameFr = fileName
            ? fileName.replace(/\.md$/, '.fr.md')               // e.g. "xss-dvwa.fr.md"
            : null;

        const contentDiv  = document.getElementById('markdown-content');
        const loadingDiv  = document.getElementById('loading');
        const langBar     = document.getElementById('lang-bar');
        const pendingNote = document.getElementById('fr-pending');
        const btnEn       = document.getElementById('btn-en');
        const btnFr       = document.getElementById('btn-fr');

        const cache = { en: null, fr: null };   // markdown content cache
        let frAvailable = false;

        // ── Build image base path from file path ─────────────────────────
        function basePath(file) {
            const folder = file.substring(0, file.lastIndexOf('/'));
            return folder ? `assets/writeups/${folder}/` : 'assets/writeups/';
        }

        // ── Render markdown, fixing relative image paths ─────────────────
        function render(md, file) {
            const base  = basePath(file);
            const fixed = md.replace(
                /!\[([^\]]*)\]\((?!http)(.*?)\)/g,
                `![$1](${base}$2)`
            );
            contentDiv.innerHTML = marked.parse(fixed);
            Prism.highlightAll();
        }

        // ── Switch displayed language ─────────────────────────────────────
        function switchLang(lang) {
            if (lang === 'fr' && !frAvailable) {
                // No .fr.md yet — show notice, stay on EN
                pendingNote.style.display = 'block';
                btnEn.classList.add('active');
                btnFr.classList.remove('active');
                return;
            }

            pendingNote.style.display = 'none';

            if (lang === 'en') {
                render(cache.en, fileName);
                btnEn.classList.add('active');
                btnFr.classList.remove('active');
            } else {
                render(cache.fr, fileNameFr);
                btnFr.classList.add('active');
                btnEn.classList.remove('active');
            }
        }

        // ── Safe fetch — returns null on 404 ─────────────────────────────
        async function fetchMd(path) {
            const res = await fetch(path);
            return res.ok ? res.text() : null;
        }

        // ── Main: load EN + try FR ────────────────────────────────────────
        async function load() {
            if (!fileName) {
                loadingDiv.innerHTML = "<span style='color:red'>[ERROR] No file specified.</span>";
                return;
            }

            try {
                // Fetch EN and FR in parallel for speed
                const [enMd, frMd] = await Promise.all([
                    fetchMd(`assets/writeups/${fileName}`),
                    fetchMd(`assets/writeups/${fileNameFr}`)
                ]);

                if (!enMd) throw new Error('File not found');

                cache.en = enMd;
                if (frMd) { cache.fr = frMd; frAvailable = true; }

                // Pick display language based on user preference
                const userLang = (typeof getLang === 'function') ? getLang() : 'en';

                if (userLang === 'fr' && frAvailable) {
                    render(cache.fr, fileNameFr);
                    btnFr.classList.add('active');
                    btnEn.classList.remove('active');
                } else {
                    render(cache.en, fileName);
                    // Show warning if user is in FR mode but no translation exists
                    if (userLang === 'fr') pendingNote.style.display = 'block';
                }

                loadingDiv.style.display = 'none';
                langBar.style.display    = 'flex';

                // Disable FR button if no translation exists
                if (!frAvailable) {
                    btnFr.disabled = true;
                    btnFr.title    = 'Version française non disponible pour ce writeup';
                }

            } catch (err) {
                loadingDiv.innerHTML = `<span style='color:red'>[ERROR] 404 — ${fileName}</span>`;
                console.error(err);
            }
        }

        load();
    </script>
    <script data-goatcounter="https://azarkovich.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
